[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solder-joint-mvp"
version = "0.1.0"
description = "Sampling and review tools for regular circular solder-joint arrays"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
  "numpy>=1.26",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
solder-mvp = "solder_mvp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

