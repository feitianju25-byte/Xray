schema_version: "1.0"
algorithm_version: "0.3.0"
inventory:
  extensions: [".jpg", ".jpeg"]
sampling:
  limit: 120
  seed: 20260915
  include_path_pattern: "未标注"
  target_family: "frontal-chip-internal-dot-grid-v1"
  reference_image: "DataV1/数据集/X光图片20260804/未标注/焊点桥连/焊点桥连 (2).jpg"
  duplicate_hamming_threshold: 10
  max_per_duplicate_group: 1
contact_sheet:
  columns: 5
  thumbnail_width: 320
  thumbnail_height: 220
  label_height: 78
review:
  allowed_decisions: ["keep", "other_component", "reject", "uncertain"]
split:
  seed: 20260915
  validation_count: 10
candidate_detection:
  max_side: 768
  radii: [4, 6, 9, 13, 18]
  min_contrast: 0.06
  min_circularity: 0.55
  max_candidates: 500
roi:
  crop_ratio: 0.8
  output_size: [96, 96]
  boundary_policy: "pad"
  missing_policy: "skip"
